<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nations Go Championship 🌏</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>🌏 Nations Go Championship</h1>
      <nav>
        <button class="nav-btn active" data-page="games">Games</button>
        <button class="nav-btn" data-page="standings">Rankings</button>
        <button class="nav-btn" data-page="history">Game History</button>
      </nav>
      <div id="my-country"></div>
    </div>
  </header>

  <!-- 광고 영역 상단 -->
  <div class="ad-banner" id="ad-top">
    <!-- Google AdSense 코드 삽입 위치 -->
    <span style="color:#aaa;font-size:12px;">Advertisement</span>
  </div>

  <main id="app"></main>

  <!-- 광고 영역 하단 -->
  <div class="ad-banner" id="ad-bottom">
    <span style="color:#aaa;font-size:12px;">Advertisement</span>
  </div>

  <footer>
    <p>Nations Go Championship · Move every 10 min · KR/CN/JP/US League</p>
  </footer>

  <!-- Win/Lose/Draw 오버레이 -->
  <canvas id="confetti-canvas"></canvas>
  <div id="result-overlay">
    <div class="result-bg"></div>
    <div class="result-inner">
      <div class="result-flag" id="result-flag">🏁</div>
      <div class="result-text" id="result-text">VICTORY</div>
      <div class="result-sub" id="result-sub"></div>
      <div class="result-score" id="result-score"></div>
      <button class="result-close" onclick="closeResultOverlay()">Keep watching</button>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
